connection:
  netconf_port: 830
  timeout: 30
  username: user-1
  ssh_key_paths:
    - /home/user-1/.ssh/id_rsa
  password_env: # Optional password env
auth:
  # GUI accounts; created with `mig-validate user add NAME --role ROLE`.
  users_file: config/users.yml
inventory:
  # Ansible INI inventory (NAME ansible_host=IP); without it the GUI offers manual entry only.
  path: /etc/ansible/hosts
